<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roční přehled výroby</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; --success: #22c55e; --error: #ef4444; --warning: #eab308; --border: #334155;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        .status-msg { text-align: center; color: var(--accent); font-style: italic; margin-top: 20px; }
        .msg { padding: 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; line-height: 1.4; }
        .msg.red { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: #f87171; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .toolbar label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .toolbar select { background: var(--card); color: #fff; border: 2px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; font-weight: bold; outline: none; cursor: pointer; }
        .toolbar select:focus { border-color: var(--accent); }
        .sync-stav { font-size: 0.8rem; color: #94a3b8; }

        .tisk-btn { background: var(--card); border: 2px solid var(--accent); color: var(--accent); font-weight: bold; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
        .tisk-btn:hover { background: var(--accent); color: #000; }
        .tisk-btn:disabled { opacity: 0.5; cursor: wait; }

        .prehled-karta { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .prehled-nadpis { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .prehled-podnadpis { font-size: 0.85rem; color: #64748b; margin-bottom: 18px; }

        .souhrn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
        .souhrn-karta { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
        .souhrn-karta .val { display: block; font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .souhrn-karta .val.cerv { color: #f87171; }
        .souhrn-karta .lbl { display: block; font-size: 0.68rem; color: #94a3b8; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.4px; }

        .sekce-nadpis { font-size: 1rem; font-weight: 800; color: var(--accent); margin: 26px 0 12px; }

        table.prehled-table { width: 100%; border-collapse: collapse; }
        table.prehled-table th, table.prehled-table td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border); font-size: 0.88rem; white-space: nowrap; }
        table.prehled-table th { background: #1e294b; color: var(--accent); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; }
        table.prehled-table tr:last-child td { border-bottom: none; }
        table.prehled-table td.jmeno-bunka { text-align: left; font-weight: 600; color: #fff; }
        table.prehled-table td.zvyrazneno { color: var(--accent); font-weight: 800; }
        table.prehled-table td.cerv { color: #f87171; font-weight: 700; }
        table.prehled-table tr.celkem-radek td { border-top: 2px solid var(--accent); font-weight: 800; background: rgba(56, 189, 248, 0.06); }


        details.sekce { margin-bottom: 18px; }
        details.sekce > summary { list-style: none; cursor: pointer; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; user-select: none; }
        details.sekce > summary::-webkit-details-marker { display: none; }
        details.sekce > summary:hover { border-color: var(--accent); }
        details.sekce[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; }
        details.sekce > summary .nadpis { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
        details.sekce > summary .info { font-size: 0.8rem; color: #94a3b8; margin-left: auto; }
        details.sekce > summary .sipka { color: var(--accent); transition: transform .15s; }
        details.sekce[open] > summary .sipka { transform: rotate(90deg); }
        details.sekce > .prehled-karta { margin-bottom: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
        table.prehled-table th.tridit { cursor: pointer; user-select: none; }
        table.prehled-table th.tridit:hover { color: #fff; }
        table.prehled-table th.aktivni { color: #fff; }
        table.prehled-table th .sip { display: inline-block; width: 1em; }

        .poznamka { font-size: 0.78rem; color: #64748b; line-height: 1.55; margin-top: 6px; }
        .poznamka b { color: #94a3b8; }

        @media screen and (max-width: 640px) {
            body { padding: 12px 10px; }
            h1 { font-size: 1.25rem !important; letter-spacing: 1px !important; }
            .prehled-karta { padding: 14px 12px; border-radius: 12px; }
            .souhrn-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .souhrn-karta { padding: 12px 8px; }
            .souhrn-karta .val { font-size: 1.1rem; }
            .souhrn-karta .lbl { font-size: 0.62rem; }
            table.prehled-table { min-width: 640px; }
            table.prehled-table th, table.prehled-table td { padding: 9px 8px; font-size: 0.82rem; }
            table.prehled-table td.jmeno-bunka, table.prehled-table th:first-child { position: sticky; left: 0; background: var(--card); z-index: 1; }
            table.prehled-table th:first-child { background: #1e294b; }
            table.prehled-table tr.celkem-radek td.jmeno-bunka { background: #213349; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 10px; letter-spacing: 2px;">ROČNÍ PŘEHLED VÝROBY</h1>
    <p style="text-align: center; color: #64748b; margin-top: 0; margin-bottom: 30px;">Souhrn minut, množství, neshod a cen za celý rok podle středisek a lidí</p>

    <div class="toolbar">
        <div class="toolbar-left">
            <label for="rok-select">Rok</label>
            <select id="rok-select" onchange="vykresli()"></select>
            <span class="sync-stav" id="sync-stav"></span>
        </div>
        <button class="tisk-btn" id="aktualizovat-btn" onclick="nacistData()">🔄 Aktualizovat data</button>
    </div>

    <div id="report-app"><div class="status-msg">Načítám data z tabulky...</div></div>
</div>

<script>
    // Publikovaná tabulka (Soubor → Sdílet → Publikovat na webu → TSV)
    const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ96ftfQLYyOBBC_17B8M8-6FgaTaY_YO-1QjR3GHWZlLAdUihoAoHOX49Yt-FvgdXGeMMtoduOQDbf/pub?output=tsv';

    // Sloupce se hledají podle přesného názvu hlavičky; písmeno sloupce slouží jako záloha.
    const SLOUPCE = {
        datum:    { hlavicka: 'datum likvidace',            zaloha: 0  },  // A
        vykazano: { hlavicka: 'cas celkem vykazany',        zaloha: 1  },  // B (váha pro produktivitu)
        cas:      { hlavicka: 'cas planovany skutecny',     zaloha: 2  },  // C
        mnozstvi: { hlavicka: 'mnozstvi',                   zaloha: 3  },  // D
        neshodne: { hlavicka: 'mnozstvi neshodne',          zaloha: 4  },  // E
        cena:     { hlavicka: 'cena celkem',                zaloha: 8  },  // I
        jmeno:    { hlavicka: 'cele jmeno',                 zaloha: 14 },  // O
        prod:     { hlavicka: 'produktivita (%)',           zaloha: 22 },  // W
        stredisko:{ hlavicka: 'identifikator strediska',    zaloha: 36 }   // AK
    };

    let vsechnyRadky = [];

    // ---------- pomocné funkce ----------
    function normalizovatText(s) {
        return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ');
    }
    function ocistitBunku(v) {
        if (v === undefined || v === null) return '';
        return String(v).replace(/\u00A0/g, ' ').trim();
    }
    function parseCislo(v) {
        const cisty = ocistitBunku(v).replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-]/g, '');
        const n = parseFloat(cisty);
        return isNaN(n) ? 0 : n;
    }
    function formatCislo(n, desetin) {
        return n.toLocaleString('cs-CZ', { minimumFractionDigits: desetin, maximumFractionDigits: desetin });
    }
    function formatKc(n) {
        return `${Math.round(n).toLocaleString('cs-CZ')} Kč`;
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // TSV parser – uvozovky bere v úvahu jen na začátku pole (jinak by rozbil poznámky s uvozovkou uvnitř textu)
    function parseTSV(text) {
        text = text.replace(/^\uFEFF/, '');
        const rows = [];
        let row = [], field = '', inQuotes = false, zacatekPole = true;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"') {
                    if (text[i + 1] === '"') { field += '"'; i++; }
                    else { inQuotes = false; }
                } else { field += c; }
            } else if (c === '"' && zacatekPole) {
                inQuotes = true; zacatekPole = false;
            } else if (c === '\t') {
                row.push(field); field = ''; zacatekPole = true;
            } else if (c === '\r') {
                /* ignore */
            } else if (c === '\n') {
                row.push(field); rows.push(row); row = []; field = ''; zacatekPole = true;
            } else {
                field += c; zacatekPole = false;
            }
        }
        if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
        return rows.filter(r => r.some(v => v.trim() !== ''));
    }

    function najitSloupce(headerRow) {
        const hlavicky = headerRow.map(h => normalizovatText(h));
        const idx = {};
        const chybi = [];
        Object.keys(SLOUPCE).forEach(k => {
            const nalezeno = hlavicky.indexOf(SLOUPCE[k].hlavicka);
            if (nalezeno !== -1) idx[k] = nalezeno;
            else {
                idx[k] = SLOUPCE[k].zaloha;
                chybi.push(SLOUPCE[k].hlavicka);
            }
        });
        return { idx, chybi };
    }

    function rokZDatumu(s) {
        const m = String(s).match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
        return m ? parseInt(m[3], 10) : null;
    }

    function parseDatum(s) {
        const m = String(s).match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
        return m ? new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10)) : null;
    }
    function formatDatum(d) { return d ? d.toLocaleDateString('cs-CZ') : '—'; }

    // ---------- načtení ----------
    function nastavStav(text, stav) {
        const el = document.getElementById('sync-stav');
        el.textContent = text;
        el.style.color = stav === 'ok' ? 'var(--success)' : stav === 'chyba' ? 'var(--error)' : '#94a3b8';
    }

    async function nacistData() {
        const app = document.getElementById('report-app');
        const btn = document.getElementById('aktualizovat-btn');
        btn.disabled = true;
        app.innerHTML = `<div class="status-msg">Stahuji tabulku, u celého roku to může chvíli trvat...</div>`;
        nastavStav('', '');

        try {
            let text;
            try {
                const odpoved = await fetch(TSV_URL, { cache: 'no-store' });
                if (!odpoved.ok) throw new Error('HTTP ' + odpoved.status);
                text = await odpoved.text();
            } catch (e) {
                throw new Error('Nepodařilo se stáhnout tabulku (' + e.message + '). Zkontrolujte připojení a že je tabulka stále publikovaná na webu.');
            }

            const radky = parseTSV(text);
            if (radky.length < 2) throw new Error('Tabulka neobsahuje žádná data.');

            const { idx, chybi } = najitSloupce(radky[0]);

            vsechnyRadky = radky.slice(1).map(c => {
                const mnozstvi = parseCislo(c[idx.mnozstvi]);
                const neshodne = parseCislo(c[idx.neshodne]);
                const cena = parseCislo(c[idx.cena]);
                return {
                    rok: rokZDatumu(c[idx.datum]),
                    datum: parseDatum(c[idx.datum]),
                    cas: parseCislo(c[idx.cas]),
                    vykazano: parseCislo(c[idx.vykazano]),
                    mnozstvi, neshodne, cena,
                    jmeno: ocistitBunku(c[idx.jmeno]),
                    prod: parseCislo(c[idx.prod]),
                    stredisko: ocistitBunku(c[idx.stredisko]),
                    platne: /^\d+$/.test(ocistitBunku(c[idx.stredisko]))
                };
            }).filter(r => r.cas !== 0 || r.mnozstvi !== 0 || r.cena !== 0 || r.neshodne !== 0);

            if (vsechnyRadky.length === 0) throw new Error('V tabulce nejsou žádné použitelné řádky.');

            naplnitRoky();
            const upozorneni = chybi.length ? ` · ⚠ nenalezena hlavička: ${chybi.join(', ')} (použito písmeno sloupce)` : '';
            nastavStav(`☁ Načteno ${vsechnyRadky.length.toLocaleString('cs-CZ')} řádků – ${new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}${upozorneni}`, chybi.length ? 'chyba' : 'ok');
            vykresli();
        } catch (e) {
            app.innerHTML = `<div class="msg red">${escapeHtml(e.message)}</div>`;
        } finally {
            btn.disabled = false;
        }
    }

    function naplnitRoky() {
        const sel = document.getElementById('rok-select');
        const predchozi = sel.value;
        const roky = [...new Set(vsechnyRadky.map(r => r.rok).filter(r => r !== null))].sort((a, b) => b - a);
        sel.innerHTML = roky.map(r => `<option value="${r}">${r}</option>`).join('') + `<option value="vse">Všechna data</option>`;
        if (predchozi && [...sel.options].some(o => o.value === predchozi)) sel.value = predchozi;
        else if (roky.length > 0) sel.value = String(roky[0]);
        else sel.value = 'vse';
    }

    // ---------- agregace ----------
    function secti(radky) {
        const s = { minuty: 0, mnozstvi: 0, neshodne: 0, cena: 0, radku: 0, prodSoucin: 0, vahaProd: 0 };
        radky.forEach(r => {
            s.minuty += r.cas;
            s.mnozstvi += r.mnozstvi;
            s.neshodne += r.neshodne;
            s.cena += r.cena;
            s.radku += 1;
            // orientační produktivita = průměr sloupce W vážený odpracovaným časem (sloupec B)
            if (r.vykazano > 0) { s.prodSoucin += r.prod * r.vykazano; s.vahaProd += r.vykazano; }
        });
        s.produktivita = s.vahaProd > 0 ? s.prodSoucin / s.vahaProd : null;
        s.podilNeshod = s.mnozstvi > 0 ? (s.neshodne / s.mnozstvi) * 100 : null;
        return s;
    }

    function seskupit(radky, funkceKlice) {
        const m = {};
        radky.forEach(r => { const k = funkceKlice(r); (m[k] = m[k] || []).push(r); });
        const total = radky.reduce((a, r) => a + r.cas, 0);
        return Object.keys(m).map(k => {
            const s = secti(m[k]);
            s.podil = total > 0 ? (s.minuty / total) * 100 : 0;   // podíl na celkových minutách
            // hlavní středisko = kde má skupina nejvíce výkazů (řádků); při shodě rozhoduje více minut
            const poc = {};
            m[k].forEach(r => { const o = poc[r.stredisko] = poc[r.stredisko] || { n: 0, min: 0 }; o.n++; o.min += r.cas; });
            const best = Object.keys(poc).sort((a, b) => (poc[b].n - poc[a].n) || (poc[b].min - poc[a].min))[0];
            s.hlavniStredisko = best !== undefined ? Number(best) : null;
            s.hlavniPodil = best !== undefined ? (poc[best].n / m[k].length) * 100 : 0;
            return { nazev: k, s };
        });
    }

    // ---------- řazení a rozbalovací tabulky ----------
    const SLOUPCE_TABULKY = [
        { klic: 'nazev',        text: null },   // text se doplní podle tabulky
        { klic: 'hlavniStredisko', text: 'Hlavní středisko', jen: 'lide' },
        { klic: 'minuty',       text: 'Minuty' },
        { klic: 'podil',        text: 'Podíl z minut' },
        { klic: 'mnozstvi',     text: 'Množství' },
        { klic: 'neshodne',     text: 'Neshodné ks' },
        { klic: 'podilNeshod',  text: '% neshod' },
        { klic: 'cena',         text: 'Cena celkem' },
        { klic: 'produktivita', text: 'Orient. produktivita' },
        { klic: 'radku',        text: 'Řádků' }
    ];
    // výchozí řazení: nejvíce odvedených minut nahoře
    const tabulky = {
        strediska: { skupiny: [], celkem: null, prvni: 'Středisko', predpona: 'Středisko ', trid: { klic: 'minuty', smer: -1 } },
        lide:      { skupiny: [], celkem: null, prvni: 'Jméno',     predpona: '',           trid: { klic: 'minuty', smer: -1 } }
    };
    const otevreno = { strediska: false, lide: false };

    function trid(id, klic) {
        const t = tabulky[id];
        if (t.trid.klic === klic) t.trid.smer = -t.trid.smer;
        else t.trid = { klic, smer: (klic === 'nazev' || klic === 'hlavniStredisko') ? 1 : -1 };   // čísla od největšího, text od A
        renderTabulka(id);
    }

    function radekSouhrnu(nazev, s, jeCelkem, id) {
        return `
            <tr class="${jeCelkem ? 'celkem-radek' : ''}">
                <td class="jmeno-bunka">${nazev}</td>
                ${id === 'lide' ? `<td>${jeCelkem || s.hlavniStredisko === null ? '—' : `Stř. ${s.hlavniStredisko} <span style="color:#64748b">(${formatCislo(s.hlavniPodil, 0)} %)</span>`}</td>` : ''}
                <td>${formatCislo(s.minuty, 0)}</td>
                <td class="zvyrazneno">${formatCislo(s.podil, 1)}%</td>
                <td>${formatCislo(s.mnozstvi, 0)}</td>
                <td>${formatCislo(s.neshodne, 0)}</td>
                <td class="${s.podilNeshod > 5 ? 'cerv' : ''}">${s.podilNeshod !== null ? formatCislo(s.podilNeshod, 1) + '%' : '—'}</td>
                <td>${formatKc(s.cena)}</td>
                <td class="zvyrazneno">${s.produktivita !== null ? formatCislo(s.produktivita, 1) + '%' : '—'}</td>
                <td>${formatCislo(s.radku, 0)}</td>
            </tr>`;
    }

    function renderTabulka(id) {
        const t = tabulky[id];
        const cil = document.getElementById('tab-' + id);
        if (!cil) return;
        const { klic, smer } = t.trid;

        const serazene = [...t.skupiny].sort((a, b) => {
            let r;
            if (klic === 'nazev') {
                r = a.nazev.localeCompare(b.nazev, 'cs', { numeric: true });
            } else {
                const va = a.s[klic] === null ? -Infinity : a.s[klic];
                const vb = b.s[klic] === null ? -Infinity : b.s[klic];
                r = va === vb ? 0 : (va < vb ? -1 : 1);
            }
            if (r !== 0) return r * smer;
            return (b.s.minuty - a.s.minuty) || a.nazev.localeCompare(b.nazev, 'cs', { numeric: true });
        });

        const hlavicka = SLOUPCE_TABULKY.filter(c => !c.jen || c.jen === id).map(c => {
            const aktivni = c.klic === klic;
            const sip = aktivni ? (smer === -1 ? '▼' : '▲') : '';
            const text = c.klic === 'nazev' ? t.prvni : c.text;
            const styl = c.klic === 'nazev' ? ' style="text-align:left;"' : '';
            return `<th class="tridit ${aktivni ? 'aktivni' : ''}"${styl} onclick="trid('${id}','${c.klic}')" title="Seřadit podle: ${text}">${text} <span class="sip">${sip}</span></th>`;
        }).join('');

        const radky = serazene.map(g => radekSouhrnu(escapeHtml(t.predpona + g.nazev), g.s, false, id)).join('');
        cil.innerHTML = `
            <table class="prehled-table">
                <thead><tr>${hlavicka}</tr></thead>
                <tbody>${radky}${radekSouhrnu('Celkem', t.celkem, true, id)}</tbody>
            </table>`;
    }

    function sekceHtml(id, nadpis, info) {
        return `
            <details class="sekce" data-id="${id}" ${otevreno[id] ? 'open' : ''}>
                <summary><span class="sipka">▶</span><span class="nadpis">${nadpis}</span><span class="info">${info}</span></summary>
                <div class="prehled-karta" id="tab-${id}"></div>
            </details>`;
    }

    // ---------- vykreslení ----------
    function vykresli() {
        const app = document.getElementById('report-app');
        if (vsechnyRadky.length === 0) return;

        const volba = document.getElementById('rok-select').value;
        const vRoce = volba === 'vse' ? vsechnyRadky : vsechnyRadky.filter(r => String(r.rok) === volba);
        const popisObdobi = volba === 'vse' ? 'všechna data' : `rok ${volba}`;

        // střediska, která nejsou číselná, jsou chyby v systému → vynechat ze všeho
        const radky = vRoce.filter(r => r.platne);
        const vynechano = vRoce.length - radky.length;

        if (radky.length === 0) {
            app.innerHTML = `<div class="status-msg">Pro ${popisObdobi} nejsou žádná data.</div>`;
            return;
        }

        const celkem = secti(radky);
        celkem.podil = 100;
        const data = radky.map(r => r.datum).filter(Boolean);
        const od = data.length ? new Date(Math.min(...data)) : null;
        const doD = data.length ? new Date(Math.max(...data)) : null;

        tabulky.strediska.skupiny = seskupit(radky, r => r.stredisko);
        tabulky.strediska.celkem = celkem;
        tabulky.lide.skupiny = seskupit(radky, r => r.jmeno || 'Neuvedeno');
        tabulky.lide.celkem = celkem;

        app.innerHTML = `
            <div class="prehled-karta">
                <div class="prehled-nadpis">📋 Celkový přehled — ${popisObdobi}</div>
                <div class="prehled-podnadpis">Všechna střediska dohromady · ${formatCislo(celkem.radku, 0)} řádků · data od ${formatDatum(od)} do ${formatDatum(doD)}</div>
                <div class="souhrn-grid">
                    <div class="souhrn-karta"><span class="val">${formatCislo(celkem.minuty, 0)}</span><span class="lbl">Celkem minut</span></div>
                    <div class="souhrn-karta"><span class="val">${formatKc(celkem.cena)}</span><span class="lbl">Cena celkem</span></div>
                    <div class="souhrn-karta"><span class="val">${formatCislo(celkem.mnozstvi, 0)}</span><span class="lbl">Množství</span></div>
                    <div class="souhrn-karta"><span class="val cerv">${formatCislo(celkem.neshodne, 0)}</span><span class="lbl">Množství neshodné${celkem.podilNeshod !== null ? ' (' + formatCislo(celkem.podilNeshod, 1) + '%)' : ''}</span></div>
                    <div class="souhrn-karta"><span class="val">${celkem.produktivita !== null ? formatCislo(celkem.produktivita, 1) + '%' : '—'}</span><span class="lbl">Orientační produktivita</span></div>
                </div>
            </div>

            ${sekceHtml('strediska', '🏭 Podle středisek', `${tabulky.strediska.skupiny.length} středisek · řazeno podle minut`)}
            ${sekceHtml('lide', '👷 Podle lidí', `${tabulky.lide.skupiny.length} lidí · řazeno podle minut`)}

            <div class="poznamka">
                <b>Jak se počítá:</b> Minuty = součet sloupce C (Čas plánovaný skutečný) · Množství = D · Neshodné = E · Cena = I ·
                <b>Orientační produktivita</b> = sloupec W zprůměrovaný váženě odpracovaným časem (sloupec B) · Středisko = sloupec AK · Jméno = sloupec O.<br>
                <b>Podíl z minut</b> = minuty řádku ÷ celkové minuty · <b>Hlavní středisko</b> = středisko, kde má člověk nejvíce výkazů (v závorce jeho podíl výkazů).<br>
                Kliknutím na záhlaví sloupce se tabulka seřadí podle něj (opakované kliknutí obrátí pořadí).
                ${vynechano > 0 ? `<br><b>Vynecháno ${formatCislo(vynechano, 0)} řádků</b> s nečíselným nebo prázdným střediskem (chyby v systému).` : ''}
            </div>`;

        renderTabulka('strediska');
        renderTabulka('lide');
        app.querySelectorAll('details.sekce').forEach(d =>
            d.addEventListener('toggle', () => { otevreno[d.dataset.id] = d.open; }));
    }

    nacistData();
</script>

</body>
</html>
